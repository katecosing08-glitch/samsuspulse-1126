<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SamsusPulse // Live Board Publisher</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --card: rgba(22, 22, 28, 0.88);
      --crimson: #dc143c;
      --wine: #800020;
      --gold: #f5c542;
      --text: #f4f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top right, #2b0711, var(--bg) 55%);
      color: var(--text);
      padding: 24px;
    }

    .topbar {
      max-width: 820px;
      margin: 0 auto 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 22px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand span { color: var(--crimson); }
    .brand small { color: var(--gold); font-size: 0.78rem; margin-left: 8px; text-transform: uppercase; }

    .nav-actions { display: flex; gap: 10px; }

    .btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      transition: 0.2s;
    }

    .btn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }

    .btn-primary {
      background: linear-gradient(135deg, var(--crimson), var(--wine));
      border: none;
      color: #fff;
      box-shadow: 0 6px 20px rgba(220, 20, 60, 0.35);
    }

    .btn-primary:hover:not(:disabled) { opacity: 0.92; color: #fff; }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .publisher-card {
      max-width: 820px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    h1 { font-size: 1.5rem; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 0.92rem; margin-bottom: 24px; }

    .author-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(245, 197, 66, 0.1);
      border: 1px solid rgba(245, 197, 66, 0.3);
      color: var(--gold);
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; font-weight: 600; }

    input, textarea {
      width: 100%;
      padding: 13px 15px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(10, 10, 12, 0.8);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, textarea:focus { border-color: var(--crimson); }
    input:disabled, textarea:disabled { opacity: 0.55; cursor: not-allowed; }
    textarea { min-height: 150px; resize: vertical; line-height: 1.5; }

    .status {
      margin-top: 14px;
      font-size: 0.9rem;
      min-height: 22px;
    }
  </style>
</head>
<body style="display: none;">
  <header class="topbar">
    <div class="brand">Samsus<span>Pulse</span> <small>// Publisher</small></div>
    <div class="nav-actions">
      <a href="/index.html" class="btn">← Back to Dashboard</a>
      <button type="button" id="logoutBtn" class="btn">Sign Out</button>
    </div>
  </header>

  <main class="publisher-card">
    <h1>Live Board Publisher</h1>
    <p class="subtitle">Compose and broadcast an official update to the SamsusPulse live dashboard.</p>

    <div class="author-badge" id="authorInfo">Viewing as Guest</div>

    <form id="publishForm">
      <div class="form-group">
        <label for="postTitle">Announcement / Post Title</label>
        <input type="text" id="postTitle" placeholder="Enter headline..." required />
      </div>

      <div class="form-group">
        <label for="postContent">Message Content</label>
        <textarea id="postContent" placeholder="Write your announcement or update here..." required></textarea>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">Publish to Live Board</button>
      <div class="status" id="statusMsg"></div>
    </form>
  </main>

  <script>
    localStorage.removeItem("samsuspulse_user");
    localStorage.removeItem("samsuspulse_token");

    const titleInput = document.getElementById("postTitle");
    const contentInput = document.getElementById("postContent");
    const submitBtn = document.getElementById("submitBtn");
    const statusEl = document.getElementById("statusMsg");
    const authorInfoEl = document.getElementById("authorInfo");

    function redirectToLogin() {
      sessionStorage.removeItem("samsuspulse_user");
      sessionStorage.removeItem("samsuspulse_token");
      window.location.replace("/login.html");
    }

    function applyPublisherIdentity(user) {
      const role = String(user?.role || "Guest").trim();
      const roleLower = role.toLowerCase();
      const name = String(user?.name || (roleLower === "guest" ? "Guest" : "")).trim();

      if (!name) {
        redirectToLogin();
        return;
      }

      if (roleLower === "guest") {
        authorInfoEl.textContent = `Viewing as ${name} (Guest — Read Only)`;
        titleInput.disabled = true;
        contentInput.disabled = true;
        submitBtn.disabled = true;
        submitBtn.textContent = "Guests Cannot Publish";
        statusEl.style.color = "#f5c542";
        statusEl.textContent = "Guest accounts can browse the board only. Sign in as a Member or Admin to publish.";
      } else {
        authorInfoEl.textContent = `Publishing as ${name} (${role})`;
        titleInput.disabled = false;
        contentInput.disabled = false;
        submitBtn.disabled = false;
        submitBtn.textContent = "Publish to Live Board";
        statusEl.textContent = "";
      }

      document.body.style.display = "";
    }

    async function initPublisherSession() {
      const raw = sessionStorage.getItem("samsuspulse_user");
      if (!raw) {
        redirectToLogin();
        return;
      }

      let localUser = null;
      try {
        localUser = JSON.parse(raw);
      } catch {
        redirectToLogin();
        return;
      }

      if (!localUser || !localUser.name || !localUser.role) {
        redirectToLogin();
        return;
      }

      applyPublisherIdentity(localUser);

      const token = sessionStorage.getItem("samsuspulse_token");
      try {
        const res = await fetch("/api/auth/me", {
          headers: token ? { Authorization: `Bearer ${token}` } : {}
        });
        if (!res.ok) return;
        const data = await res.json();
        if (!data.authenticated || !data.user) {
          redirectToLogin();
          return;
        }
        sessionStorage.setItem("samsuspulse_user", JSON.stringify(data.user));
        applyPublisherIdentity(data.user);
      } catch {
        // Keep current session UI if offline/unreachable
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      const token = sessionStorage.getItem("samsuspulse_token");
      try {
        await fetch("/api/auth/logout", {
          method: "POST",
          headers: token ? { Authorization: `Bearer ${token}` } : {}
        });
      } catch {}
      redirectToLogin();
    });

    document.getElementById("publishForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const title = titleInput.value.trim();
      const content = contentInput.value.trim();
      const token = sessionStorage.getItem("samsuspulse_token");

      const currentUser = JSON.parse(sessionStorage.getItem("samsuspulse_user") || "null");
      if (String(currentUser?.role || "").toLowerCase() === "guest") {
        applyPublisherIdentity(currentUser);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Publishing...";
      statusEl.textContent = "";

      try {
        const res = await fetch("/api/posts", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            ...(token ? { Authorization: `Bearer ${token}` } : {})
          },
          body: JSON.stringify({ title, content })
        });

        const data = await res.json();
        if (res.status === 401) {
          redirectToLogin();
          return;
        }
        if (!res.ok) {
          throw new Error(data.error || "Failed to publish.");
        }

        statusEl.style.color = "#4ade80";
        statusEl.textContent = "Published! Redirecting to Dashboard...";
        setTimeout(() => {
          window.location.replace("/index.html");
        }, 700);
      } catch (err) {
        statusEl.style.color = "#f87171";
        statusEl.textContent = err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = "Publish to Live Board";
      }
    });

    initPublisherSession();
  </script>
</body>
</html>
</body>
</html>
