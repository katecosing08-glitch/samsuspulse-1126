<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SamsusPulse — Publish Post</title>
  <style>
    :root {
      --bg: #090709;
      --card: #140f13;
      --border: #3a1924;
      --crimson: #b91c3c;
      --crimson-bright: #e11d48;
      --gold: #f5c451;
      --text: #faf7f8;
      --muted: #b8a8af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(185, 28, 60, 0.2), transparent 45%),
        var(--bg);
      color: var(--text);
      padding: 28px 18px;
    }
    .container { max-width: 720px; margin: 0 auto; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }
    .brand { font-size: 1.35rem; font-weight: 800; }
    .brand span { color: var(--gold); }
    .nav-actions { display: flex; gap: 10px; align-items: center; }
    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--gold); }
    .btn-primary {
      background: linear-gradient(135deg, var(--crimson), var(--crimson-bright));
      border-color: transparent;
      color: #fff;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 26px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
    }
    h1 { font-size: 1.5rem; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 0.86rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b080a;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
    }
    textarea { min-height: 150px; resize: vertical; }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
    }
    #statusMsg {
      margin-top: 14px;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">Samsus<span>Pulse</span></div>
      <div class="nav-actions">
        <a href="/index.html" class="btn">Back to Feed</a>
        <button type="button" id="logoutBtn" class="btn">Log Out</button>
      </div>
    </header>

    <main class="card">
      <h1>Create a New Post</h1>
      <p class="sub" id="postingAs">Posting as Member</p>

      <form id="publishForm">
        <div class="field">
          <label for="postTitle">Title</label>
          <input type="text" id="postTitle" required maxlength="140" placeholder="Give your post a clear headline" />
        </div>
        <div class="field">
          <label for="postContent">Content</label>
          <textarea id="postContent" required placeholder="Write what you'd like to share with the feed..."></textarea>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary">Publish Post</button>
      </form>

      <p id="statusMsg"></p>
    </main>
  </div>

  <script>
    const session = JSON.parse(localStorage.getItem("samsuspulse_user") || "null");
    if (!session || (!session.email && !session.username)) {
      window.location.href = "/login.html";
    }

    const displayAuthor = session.username || session.name || session.email || "Member";
    const displayRole = session.role || "Member";
    document.getElementById("postingAs").textContent = `Posting as ${displayAuthor} (${displayRole})`;

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("samsuspulse_user");
      window.location.href = "/login.html";
    });

    document.getElementById("publishForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const status = document.getElementById("statusMsg");
      const title = document.getElementById("postTitle").value.trim();
      const content = document.getElementById("postContent").value.trim();

      btn.disabled = true;
      btn.textContent = "Publishing...";
      status.style.color = "#b8a8af";
      status.textContent = "";

      try {
        const res = await fetch("/api/posts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            author: displayAuthor,
            authorEmail: session.email || "",
            role: displayRole,
            title,
            content
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to publish.");

        status.style.color = "#4ade80";
        status.textContent = "Published! Redirecting to Dashboard...";
        setTimeout(() => {
          window.location.href = "/index.html";
        }, 400);
      } catch (err) {
        status.style.color = "#fb7185";
        status.textContent = err.message || "Error publishing post.";
        btn.disabled = false;
        btn.textContent = "Publish Post";
      }
    });
  </script>
</body>
</html>
