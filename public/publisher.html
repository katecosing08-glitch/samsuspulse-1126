<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SamsusPulse // Live Board Publisher</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --card: rgba(22, 22, 28, 0.88);
      --crimson: #dc143c;
      --wine: #800020;
      --gold: #f5c542;
      --text: #f4f4f6;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top right, #2b0711, var(--bg) 55%);
      color: var(--text);
      padding: 24px;
    }

    .topbar {
      max-width: 820px;
      margin: 0 auto 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 22px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand span { color: var(--crimson); }
    .brand small { color: var(--gold); font-size: 0.78rem; margin-left: 8px; text-transform: uppercase; }

    .nav-actions { display: flex; gap: 10px; }

    .btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      transition: 0.2s;
    }

    .btn:hover { border-color: var(--gold); color: var(--gold); }

    .btn-primary {
      background: linear-gradient(135deg, var(--crimson), var(--wine));
      border: none;
      color: #fff;
      box-shadow: 0 6px 20px rgba(220, 20, 60, 0.35);
    }

    .btn-primary:hover { opacity: 0.92; color: #fff; }

    .publisher-card {
      max-width: 820px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    h1 { font-size: 1.5rem; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 0.92rem; margin-bottom: 24px; }

    .author-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(245, 197, 66, 0.1);
      border: 1px solid rgba(245, 197, 66, 0.3);
      color: var(--gold);
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; font-weight: 600; }

    input, textarea {
      width: 100%;
      padding: 13px 15px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(10, 10, 12, 0.8);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, textarea:focus { border-color: var(--crimson); }
    textarea { min-height: 150px; resize: vertical; line-height: 1.5; }

    .status {
      margin-top: 14px;
      font-size: 0.9rem;
      min-height: 22px;
    }
  </style>
</head>
<body style="display: none;">
  <header class="topbar">
    <div class="brand">Samsus<span>Pulse</span> <small>// Publisher</small></div>
    <div class="nav-actions">
      <a href="/index.html" class="btn">← Back to Dashboard</a>
      <button id="logoutBtn" class="btn">Logout</button>
    </div>
  </header>

  <main class="publisher-card">
    <h1>Live Board Publisher</h1>
    <p class="subtitle">Compose and broadcast an official update to the SamsusPulse live dashboard.</p>

    <div class="author-badge" id="authorInfo">Publishing as Member</div>

    <form id="publishForm">
      <div class="form-group">
        <label for="postTitle">Announcement / Post Title</label>
        <input type="text" id="postTitle" placeholder="Enter headline..." required />
      </div>

      <div class="form-group">
        <label for="postContent">Message Content</label>
        <textarea id="postContent" placeholder="Write your announcement or update here..." required></textarea>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">Publish to Live Board</button>
      <div class="status" id="statusMsg"></div>
    </form>
  </main>

  <script>
    localStorage.removeItem("samsuspulse_user");

    const session = JSON.parse(sessionStorage.getItem("samsuspulse_user") || "null");
    if (!session) {
      window.location.replace("/login.html");
    } else {
      document.body.style.display = "";
      document.getElementById("authorInfo").textContent =
        `Publishing as ${session.name || session.username || "Member"} (${session.role || "Member"})`;
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
      sessionStorage.removeItem("samsuspulse_user");
      window.location.replace("/login.html");
    });

    document.getElementById("publishForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const status = document.getElementById("statusMsg");
      const title = document.getElementById("postTitle").value;
      const content = document.getElementById("postContent").value;

      btn.disabled = true;
      btn.textContent = "Publishing...";
      status.textContent = "";

      try {
        const res = await fetch("/api/posts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            author: session.name || session.username || "Member",
            role: session.role || "Member",
            title,
            content
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to publish.");

        status.style.color = "#4ade80";
        status.textContent = "Published! Redirecting to Dashboard...";
        setTimeout(() => {
          window.location.replace("/index.html");
        }, 700);
      } catch (err) {
        status.style.color = "#f87171";
        status.textContent = err.message;
        btn.disabled = false;
        btn.textContent = "Publish to Live Board";
      }
    });
  </script>
</body>
</html>
