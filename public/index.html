<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SamsusPulse — Dashboard</title>
  <style>
    :root {
      --bg: #090709;
      --card: #140f13;
      --border: #3a1924;
      --crimson: #b91c3c;
      --crimson-bright: #e11d48;
      --gold: #f5c451;
      --text: #faf7f8;
      --muted: #b8a8af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(185, 28, 60, 0.22), transparent 45%),
        var(--bg);
      color: var(--text);
      padding: 28px 18px;
    }
    .container { max-width: 820px; margin: 0 auto; }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .brand { font-size: 1.45rem; font-weight: 800; }
    .brand span { color: var(--gold); }
    .user-info { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--gold); }
    .btn-primary {
      background: linear-gradient(135deg, var(--crimson), var(--crimson-bright));
      border-color: transparent;
      color: #fff;
    }
    .btn-danger {
      background: rgba(185, 28, 60, 0.18);
      border-color: rgba(225, 29, 72, 0.55);
      color: #fda4af;
    }
    .btn-danger:hover {
      background: var(--crimson-bright);
      color: #fff;
    }
    #feedList { display: grid; gap: 16px; }
    .post-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }
    .post-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 0.86rem;
    }
    .badge {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      color: var(--gold);
      background: rgba(245, 196, 81, 0.12);
      border: 1px solid rgba(245, 196, 81, 0.3);
    }
    .post-title { font-size: 1.18rem; margin-bottom: 8px; }
    .post-content { color: var(--text); line-height: 1.6; white-space: pre-wrap; }
    .empty {
      text-align: center;
      color: var(--muted);
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 36px 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div>
        <div class="brand">Samsus<span>Pulse</span></div>
        <div id="sessionBanner" class="user-info"></div>
      </div>
      <div class="actions">
        <a href="/publisher.html" class="btn btn-primary">+ New Post</a>
        <button type="button" id="refreshBtn" class="btn">Refresh</button>
        <button type="button" id="logoutBtn" class="btn">Log Out</button>
      </div>
    </header>

    <main id="feedList">
      <p class="empty">Loading posts...</p>
    </main>
  </div>

  <script>
    const session = JSON.parse(sessionStorage.getItem("samsuspulse_user") || "null");
// inside logoutBtn click handler:
sessionStorage.removeItem("samsuspulse_user"); {
      window.location.href = "/login.html";
    }

    const currentUser = (session.username || session.name || session.email || "").trim().toLowerCase();
    const currentEmail = (session.email || "").trim().toLowerCase();
    const isAdmin = session.role === "Admin";

    document.getElementById("sessionBanner").textContent =
      `Signed in as ${session.username || session.name || session.email} (${session.role || "Member"})`;

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("samsuspulse_user");
      window.location.href = "/login.html";
    });

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function deletePost(postId) {
      try {
        const res = await fetch(`/api/posts/${postId}`, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            requester: session.username || session.name || session.email || "",
            requesterEmail: session.email || "",
            requesterRole: session.role || "Member"
          })
        });
        const data = await res.json();
        if (!res.ok) {
          alert(data.error || "Could not delete post.");
          return;
        }
        await loadPosts();
      } catch (err) {
        alert("Failed to connect to server while deleting post.");
      }
    }

    async function loadPosts() {
      const feedList = document.getElementById("feedList");
      try {
        const res = await fetch("/api/posts");
        const data = await res.json();
        const posts = Array.isArray(data) ? data : (data.posts || []);

        if (!posts.length) {
          feedList.innerHTML = `<p class="empty">No posts yet. Click <strong>+ New Post</strong> to publish the first one.</p>`;
          return;
        }

        feedList.innerHTML = posts.map(post => {
          const time = post.timestamp ? new Date(post.timestamp).toLocaleString() : "Just now";
          const canDelete =
            isAdmin ||
            (currentUser && String(post.author || "").trim().toLowerCase() === currentUser) ||
            (currentEmail && String(post.authorEmail || "").trim().toLowerCase() === currentEmail);

          return `
            <article class="post-card">
              <div class="post-meta">
                <div>
                  <strong>${escapeHtml(post.author || "Member")}</strong>
                  <span class="badge">${escapeHtml(post.role || "Member")}</span>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                  <span>${escapeHtml(time)}</span>
                  ${canDelete ? `<button type="button" class="btn btn-danger" style="padding: 4px 10px; font-size: 0.78rem;" onclick="deletePost(${Number(post.id)})">Delete</button>` : ""}
                </div>
              </div>
              <h3 class="post-title">${escapeHtml(post.title)}</h3>
              <p class="post-content">${escapeHtml(post.content)}</p>
            </article>
          `;
        }).join("");
      } catch (err) {
        feedList.innerHTML = `<p class="empty">Unable to load posts from the server.</p>`;
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", loadPosts);
    loadPosts();
  </script>
</body>
</html>
